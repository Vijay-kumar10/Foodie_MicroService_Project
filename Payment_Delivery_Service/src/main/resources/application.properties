spring.application.name=Payment-Delivery-Service
server.port=9094

#DataBase connectivety
spring.datasource.url=jdbc:mysql://localhost:3307/Payment_Service_DB?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Vijay
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

#Euraka client configurations
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

#Rabbit Mq connection Configurations
#spring.rabbitmq.host=localhost
#spring.rabbitmq.port=5672
#spring.rabbitmq.password=guest
#spring.rabbitmq.username=guest

#Kafka configuration
spring.cloud.stream.kafka.binder.brokers=localhost:5670

#Input Binding Using Steam
spring.cloud.stream.bindings.orderEvent-in-0.destination=order.event
spring.cloud.stream.bindings.orderEvent-in-0.content-type=application/json
spring.cloud.stream.bindings.orderEvent-in-0.group=${spring.application.name}

#Output Binding using Stream
spring.cloud.stream.bindings.orderReceived-out-0.destination=order.acknowledge
spring.cloud.stream.bindings.orderReceived-out-0.content-type=application/json
