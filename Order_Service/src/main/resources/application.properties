spring.application.name=Order-Service
server.port=9096


spring.datasource.url=jdbc:mysql://localhost:3307/Order_Service_DB?createDatabaseIfNotExist=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.datasource.username=root
spring.datasource.password=Vijay


#endpoint of eureka server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

#set the path of api
spring.cloud.function.web.path=/api
spring.cloud.function.definition=orderReceived

#RabbitMq configuration
#spring.rabbitmq.host=localhost
#spring.rabbitmq.port=5672
#spring.rabbitmq.username=guest
#spring.rabbitmq.password=guest

#kafka configuration
spring.cloud.stream.kafka.binder.brokers=localhost:5670

#Output Binding using Stream
spring.cloud.stream.bindings.orderCreated-out-0.destination=order.event
spring.cloud.stream.bindings.orderCreated-out-0.content-type=application/json

#Input Binding using Stream
spring.cloud.stream.bindings.orderReceived-in-0.destination=order.acknowledge
spring.cloud.stream.bindings.orderReceived-in-0.content-type=application/json
spring.cloud.stream.bindings.orderReceived-in-0.group=${spring.application.name}
