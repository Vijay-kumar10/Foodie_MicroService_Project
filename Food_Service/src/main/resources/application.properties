spring.application.name=food-service

#set into environment
spring.profiles.active=dev

#hamko configuration kaha se import kerni hai
spring.config.import=optional:configserver:http://localhost:9092/

#Rabbit-MQ configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.password=guest
spring.rabbitmq.username=guest

#CircuitBreaker properties
spring.cloud.openfeign.circuitbreaker.enabled=true


#Resiliance4j circuitBreaker configuration
# Default Circuit Breaker Config for all services
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true

